<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PediCare Office</title><style>
:root{--navy:#092d78;--blue:#073b91;--ink:#102c62;--muted:#5e6b80;--pale:#f3f7ff;--line:#e2e7ef;--teal:#08aaa9}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f6f8fc}button,input,select,textarea{font:inherit}button{cursor:pointer;border-radius:8px;border:1px solid #d7deeb;background:#fff;color:var(--ink);font-weight:600;padding:11px 16px}button:hover{filter:brightness(.97)}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--navy);color:white;border-color:var(--navy)}.outline{border:1.5px solid #8da4cc;background:white}.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:22px;color:#092c73}.logo{display:grid;place-items:center;background:var(--navy);color:white;border-radius:10px;width:46px;height:46px;font-size:28px}.top{height:82px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top small{font-weight:500;color:#53627c}.login-page{min-height:100vh;background:#f2f6ff;display:flex;flex-direction:column}.login-main{flex:1;display:grid;grid-template-columns:1fr 420px;gap:5vw;align-items:center;padding:45px max(7vw,35px)}.welcome{max-width:510px;margin:auto}.welcome h1{font-size:54px;line-height:1.25;margin:0 0 18px;color:#092d78}.welcome p{font-size:20px;line-height:1.8;color:#626c7a}.login-card{background:white;border-radius:12px;padding:34px 30px;box-shadow:0 4px 20px #142c5510}.login-card h2{font-size:20px;margin:0 0 26px}.field{margin-bottom:17px}.field label{display:block;color:#596477;font-size:13px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #d5d9e0;border-radius:7px;background:#fff;color:#27364f}.login-card .primary{width:100%;margin:5px 0 18px}.separator{display:flex;align-items:center;gap:14px;color:#777;margin:0 0 18px}.separator:before,.separator:after{content:"";height:1px;background:#ddd;flex:1}.hint{background:#edf2ff;padding:14px;border-radius:7px;font-size:14px;line-height:1.7;color:#354766;margin-top:13px}.login-footer{background:#082d78;color:white;display:flex;justify-content:space-around;text-align:center;padding:20px;gap:20px}.login-footer strong{display:block;margin:7px 0}.login-footer small{color:#e2e9fa}.shell{min-height:100vh;background:#f7f8fc}.top .userbox{display:flex;align-items:center;gap:20px;font-size:13px;text-align:right}.app{display:flex;min-height:calc(100vh - 82px)}.sidebar{width:243px;background:#073581;color:#fff;padding:22px 15px;display:flex;flex-direction:column;flex-shrink:0}.navitem{display:flex;align-items:center;gap:14px;color:white;border:0;background:transparent;text-align:left;margin:4px 0;padding:16px 14px;font-weight:600}.navitem.active{background:white;color:#123575}.navitem .ico{width:22px;font-size:20px;text-align:center}.sidebar .logout{margin-top:auto}.content{padding:26px 28px;flex:1;min-width:0}.content h1{font-size:27px;margin:0 0 7px}.sub{color:#657187;font-size:14px;margin-bottom:24px}.card{background:white;border:1px solid #e1e5ec;border-radius:12px;padding:20px;box-shadow:0 1px 2px #142c5505}.card h3{font-size:17px;margin:0 0 14px}.grid{display:grid;gap:18px}.grid2{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:repeat(4,1fr)}.patient-info{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:20px}.label{font-size:12px;color:#66738a;margin:12px 0 5px}.value{font-size:15px;font-weight:700;color:#152d5a}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.visit{border:1px solid #e7eaf0;background:#fafbfe;border-radius:9px;padding:12px;display:flex;align-items:center;gap:14px;margin:10px 0}.datebox{min-width:48px;text-align:center;border:1px solid #e2e5ed;background:white;border-radius:6px;padding:7px;font-size:12px}.visit .detail{flex:1}.visit strong{display:block;font-size:14px}.visit small{color:#64718a;display:block;margin-top:5px}.msg{background:#eef4ff;border-left:4px solid var(--navy);padding:14px;border-radius:5px;font-size:13px;line-height:1.65}.msg strong{display:block;margin-bottom:8px}.chart{height:230px;position:relative;margin-top:12px}.chart svg{width:100%;height:100%}.stat{display:flex;align-items:center;justify-content:space-between;min-height:145px}.stat .number{font-size:38px;font-weight:800;margin:14px 0}.stat .bigico{font-size:36px;color:#0c4ba0}.searchrow{display:flex;gap:12px}.searchrow input{flex:1;min-width:0;padding:13px;border:1px solid #d9e0eb;border-radius:8px}.patient-summary{background:#edf5ff;border-radius:9px;padding:15px}.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{background:#f5f8fc;border:1px solid #e4e9f1;border-radius:8px;padding:13px;text-align:center}.mini small{display:block;color:#66748b;font-size:12px}.mini strong{display:block;margin-top:6px}.history-item{padding:13px;border-bottom:1px solid #e8ebf1;display:flex;justify-content:space-between;font-size:13px}.history-item:last-child{border:0}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid #e9edf3}.table th{color:#5c6880}.schedule{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf0f5;font-size:12px}.tasks label{display:flex;gap:10px;margin:15px 0;font-size:13px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{background:#f5f8ff;padding:20px 12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#081b3a80;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:white;width:min(520px,100%);border-radius:12px;padding:25px;box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 20px}.modal .field textarea{min-height:90px}.toast{position:fixed;bottom:24px;right:24px;background:#123778;color:white;padding:14px 20px;border-radius:9px;z-index:30;box-shadow:0 6px 20px #0002}.mobile-toggle{display:none}
